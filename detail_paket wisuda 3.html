<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Paket 3</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
}

/* Card */
.card {
    width: 350px;
    margin: 20px auto;
    background: #cfa0a0;
    padding: 15px;
    border-radius: 10px;
    color: white;
}

/* FOTO */
.foto-row {
    display: flex;
    gap: 10px;
}

.foto-item {
    width: 33%;
    text-align: center;
}

.foto-item img {
    width: 100%;
    height: 90px;
    object-fit: cover;
    border-radius: 5px;
}

.foto-item p {
    font-size: 10px;
}

/* Judul */
.title {
    text-align: center;
}

.price {
    text-align: center;
    font-weight: bold;
}

/* SIZE */
.size-btn {
    background: white;
    border: none;
    padding: 5px 10px;
    margin: 3px;
    border-radius: 5px;
    cursor: pointer;
}

.size-btn.active {
    background: #d97c84;
    color: white;
}

/* KALENDER */
.calendar {
    background: white;
    color: black;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    text-align: center;
}

.days {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
}

.day {
    width: 35px;
    height: 35px;
    line-height: 35px;
    border-radius: 5px;
    cursor: pointer;
    background: #eee;
}

.day.active {
    background: #d97c84;
    color: white;
}

/* BUTTON */
.btn {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: #d97c84;
    border: none;
    color: white;
    border-radius: 20px;
}
</style>
</head>

<body>

<div class="card">

    <!-- FOTO -->
    <div class="foto-row">
        <div class="foto-item">
            <img src="kebaya 3.jpeg">
            <p>Kebaya by ccdressrent</p>
        </div>

        <div class="foto-item">
            <img src="gallery grad photo 1.jpg">
            <p>Photoshoot by gallery graduation</p>
        </div>

        <div class="foto-item">
            <img src="airinmt makeup .jpg">
            <p>Makeup by airinmtmua</p>
        </div>
    </div>

    <!-- JUDUL -->
    <h3 class="title">Paket Wisuda 3</h3>
    <p class="price">Rp. 2.500.000</p>

    <!-- SIZE -->
    <div>
        <p>Size baju</p>
        <button class="size-btn">S</button>
        <button class="size-btn">M</button>
        <button class="size-btn">L</button>
        <button class="size-btn">XL</button>
    </div>

    <!-- KALENDER -->
    <div class="calendar">
        <p>Mei 2026</p>
        <div class="days">
            <span class="day">1</span>
            <span class="day">2</span>
            <span class="day">3</span>
            <span class="day">4</span>
            <span class="day">5</span>
            <span class="day">6</span>
            <span class="day">7</span>
            <span class="day">8</span>
            <span class="day">9</span>
            <span class="day">10</span>
            <span class="day">11</span>
            <span class="day">12</span>
            <span class="day">13</span>
            <span class="day">14</span>
            <span class="day">15</span>
            <span class="day">16</span>
            <span class="day">17</span>
            <span class="day">18</span>
            <span class="day">19</span>
            <span class="day">20</span>
            <span class="day">21</span>
            <span class="day">22</span>
            <span class="day">23</span>
            <span class="day">24</span>
            <span class="day">25</span>
            <span class="day">26</span>
            <span class="day">27</span>
            <span class="day">28</span>
            <span class="day">29</span>
            <span class="day">30</span>
            <span class="day">31</span>
        </div>
    </div>

    <!-- BUTTON -->
    <button class="btn">Booking Sekarang</button>

</div>

<script>
// SIZE
const sizeBtns = document.querySelectorAll('.size-btn');
sizeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        sizeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });
});

// KALENDER
const days = document.querySelectorAll('.day');
days.forEach(day => {
    day.addEventListener('click', () => {
        days.forEach(d => d.classList.remove('active'));
        day.classList.add('active');
    });
});
</script>

</body>
</html>
